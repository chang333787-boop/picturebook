<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>가지 branch — 교사 로그인</title>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet"/>
  <style>
    /* W8 Warm Paper: 선생님 영역 — index.html, maker join, viewer entry와 같은 종이톤.
       선생님 강조색은 골드 — index.html admin 카드와 일치. 진엽서/공책 느낌. */
    :root {
      --bg:        #fbf6ea;
      --paper-2:   #f4ecd8;
      --cream:     #fffaee;
      --line:      rgba(80,50,20,0.10);
      --line-2:    rgba(80,50,20,0.18);
      --ink:       #2b1f10;
      --ink-2:     #4a3820;
      --ink-3:     #6b5638;
      --pencil:    #9a8868;
      --primary:   #c79550;     /* 선생님 영역 강조색 (골드/오커) */
      --primary-2: #d6a868;
      --primary-fg:#2b1f10;
      --error:     #c8503c;
      --success:   #5a8a4a;     /* 종이톤에 어울리는 진녹 */
      --radius:    16px;
      --font-h:    'Jua', sans-serif;
      --font-b:    'Nanum Gothic', sans-serif;
      --font-hand: 'Nanum Pen Script', cursive;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{
      font-family:var(--font-b);background:var(--bg);color:var(--ink);
      min-height:100vh;display:flex;align-items:center;justify-content:center;
      padding:20px;
      position:relative;overflow-x:hidden;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(120,90,50,0.025) 0, transparent 50%),
        radial-gradient(circle at 70% 70%, rgba(120,90,50,0.020) 0, transparent 50%);
    }
    /* 종이 테이프 장식 (home/maker join/viewer entry와 통일) */
    body::before{
      content:'';position:fixed;top:32px;left:50%;
      transform:translateX(-50%) rotate(-2deg);
      width:100px;height:18px;
      background:rgba(232,164,64,0.40);
      border-radius:2px;
      box-shadow:0 1px 2px rgba(120,90,50,0.10);
      opacity:0.7;
      pointer-events:none;
      z-index:0;
    }

    .auth-wrap {
      width:100%;max-width:400px;
      position:relative;z-index:1;
    }

    /* 브랜드 */
    .auth-brand {
      text-align:center;margin-bottom:24px;
    }
    .auth-brand-logo {
      font-family:var(--font-h);font-size:30px;color:var(--ink);
      letter-spacing:-0.005em;
    }
    .auth-brand-logo-accent {
      color:var(--primary);
    }
    .auth-brand-sub {
      font-family:var(--font-hand);
      font-size:20px;color:var(--primary);
      margin-bottom:6px;
      letter-spacing:0.02em;
      line-height:1;
    }

    /* 카드 */
    .auth-card {
      position:relative;
      background:var(--cream);
      border:1px solid var(--line);
      border-radius:20px;
      padding:32px 28px;
      box-shadow:
        0 1px 0 rgba(120,90,50,0.06),
        0 2px 6px rgba(120,90,50,0.06),
        0 16px 32px rgba(120,90,50,0.10);
      animation:authFadeUp 0.5s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes authFadeUp{
      from{opacity:0;transform:translateY(16px);}
      to{opacity:1;transform:translateY(0);}
    }
    .auth-card-title {
      font-family:var(--font-h);font-size:18px;color:var(--ink);
      margin-bottom:20px;text-align:center;
    }

    /* 입력 */
    .auth-field {
      margin-bottom:14px;
    }
    .auth-label {
      display:block;font-size:12px;color:var(--ink-3);
      margin-bottom:6px;font-family:var(--font-h);letter-spacing:0.03em;
    }
    .auth-input {
      width:100%;padding:12px 16px;
      background:#fdf8eb;
      border:1.5px solid var(--line-2);
      border-radius:14px;
      font-family:var(--font-b);font-size:15px;
      color:var(--ink);
      transition:border-color 180ms,background 180ms,box-shadow 180ms;
    }
    .auth-input::placeholder{color:var(--pencil);}
    .auth-input:focus{
      outline:none;
      border-color:var(--primary);
      background:var(--cream);
      box-shadow:0 0 0 3px rgba(199,149,80,0.20);
    }

    /* 버튼 */
    .auth-btn {
      width:100%;padding:13px;
      background:var(--primary);color:var(--primary-fg);
      border:none;border-radius:999px;
      font-family:var(--font-h);font-size:16px;cursor:pointer;
      margin-top:6px;
      box-shadow:0 1px 2px rgba(120,90,50,0.10),0 4px 12px rgba(199,149,80,0.24);
      transition:filter 180ms,transform 80ms,box-shadow 180ms;
      font-weight:400;
    }
    .auth-btn:hover{
      filter:brightness(1.05);
      box-shadow:0 4px 12px rgba(120,90,50,0.14),0 8px 24px rgba(199,149,80,0.30);
    }
    .auth-btn:active{transform:translateY(1px);}
    .auth-btn:disabled{opacity:.55;cursor:not-allowed;filter:none;box-shadow:0 1px 2px rgba(120,90,50,0.08);}

    /* 에러 / 상태 */
    .auth-error {
      font-size:13px;color:var(--error);margin-top:12px;
      text-align:center;min-height:20px;line-height:1.5;
      font-family:var(--font-h);
    }
    .auth-notice {
      font-size:12px;color:var(--ink-3);margin-top:16px;
      text-align:center;line-height:1.7;
      padding-top:14px;
      border-top:1px dashed var(--line);
    }

    /* 로그인 완료 상태 */
    .auth-logged-in {
      text-align:center;display:none;
    }
    .auth-logged-in-icon { font-size:48px;margin-bottom:12px; }
    .auth-logged-in-name {
      font-family:var(--font-h);font-size:18px;color:var(--ink);margin-bottom:4px;
    }
    .auth-logged-in-role {
      font-size:12px;color:var(--ink-3);margin-bottom:20px;letter-spacing:0.05em;
    }
    .auth-btn--enter {
      background:var(--success);color:#fffaee;margin-bottom:10px;
      box-shadow:0 1px 2px rgba(120,90,50,0.10),0 4px 12px rgba(90,138,74,0.24);
    }
    .auth-btn--enter:hover{
      background:#6b9b5a;
      box-shadow:0 4px 12px rgba(120,90,50,0.14),0 8px 24px rgba(90,138,74,0.30);
    }
    .auth-btn--logout {
      background:var(--paper-2);
      color:var(--ink-2);
      border:1px solid var(--line-2);
      box-shadow:none;
    }
    .auth-btn--logout:hover{
      background:#ebe0c6;color:var(--ink);
      box-shadow:none;
      filter:none;
    }

    /* 홈 링크 */
    .auth-home-link {
      display:block;text-align:center;margin-top:18px;
      font-size:12px;color:var(--ink-3);text-decoration:none;
      transition:color 150ms;
    }
    .auth-home-link:hover{color:var(--primary);}
  </style>
</head>
<body>

<div class="auth-wrap">

  <!-- 브랜드 -->
  <div class="auth-brand">
    <div class="auth-brand-sub">ㅡ 한 학기를 책임지는 ㅡ</div>
    <div class="auth-brand-logo">가지 <span class="auth-brand-logo-accent">교사 관리</span></div>
  </div>

  <!-- 카드 -->
  <div class="auth-card">

    <!-- 로그인 폼 -->
    <div id="login-form">
      <div class="auth-card-title">교사 계정으로 로그인</div>
      <div class="auth-field">
        <label class="auth-label" for="auth-email">이메일</label>
        <input id="auth-email" class="auth-input" type="email"
          placeholder="teacher@school.kr" autocomplete="email"/>
      </div>
      <div class="auth-field">
        <label class="auth-label" for="auth-pw">비밀번호</label>
        <input id="auth-pw" class="auth-input" type="password"
          placeholder="비밀번호" autocomplete="current-password"/>
      </div>
      <button id="btn-login" class="auth-btn">로그인 →</button>
      <div id="auth-error" class="auth-error"></div>
      <p class="auth-notice">
        교사 계정은 관리자가 별도 발급합니다.<br>
        계정 문의는 학교 담당자에게 확인해주세요.
      </p>
    </div>

    <!-- 로그인 완료 상태 -->
    <div id="logged-in-view" class="auth-logged-in">
      <div class="auth-logged-in-icon">✅</div>
      <div id="logged-in-name" class="auth-logged-in-name">-</div>
      <div id="logged-in-role" class="auth-logged-in-role">-</div>
      <button id="btn-enter-admin" class="auth-btn auth-btn--enter">
        관리 화면으로 →
      </button>
      <button id="btn-logout" class="auth-btn auth-btn--logout">
        로그아웃
      </button>
    </div>

  </div>

  <a href="index.html" class="auth-home-link">← 홈으로 돌아가기</a>

</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
/* ================================================================
   teacher-auth.html — 교사 로그인 전용 화면
   ─────────────────────────────────────────────────────────────────
   역할:
     Firebase Auth 이메일/비밀번호 로그인
     Custom Claim의 role 확인 (teacher | super_admin)
     인증 성공 → maker.html?admin=1 으로 이동
   ─────────────────────────────────────────────────────────────────
   임시 구조 메모:
     admin/pw fallback 제거됨. Firebase Auth 단일 경로만 사용.
   ================================================================ */

const firebaseConfig = {
  apiKey:            'AIzaSyBK12nBkj6Pdwu-zpL3w0krU1PzS78McmE',
  authDomain:        'picturebook-8731f.firebaseapp.com',
  projectId:         'picturebook-8731f',
  storageBucket:     'picturebook-8731f.firebasestorage.app',
  messagingSenderId: '590974087190',
  appId:             '1:590974087190:web:a9e9ba15adf020ff470537'
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

/* ── DOM 참조 ── */
const loginForm     = document.getElementById('login-form');
const loggedInView  = document.getElementById('logged-in-view');
const emailInput    = document.getElementById('auth-email');
const pwInput       = document.getElementById('auth-pw');
const btnLogin      = document.getElementById('btn-login');
const btnEnter      = document.getElementById('btn-enter-admin');
const btnLogout     = document.getElementById('btn-logout');
const authError     = document.getElementById('auth-error');
const loggedInName  = document.getElementById('logged-in-name');
const loggedInRole  = document.getElementById('logged-in-role');

const ROLE_LABEL = {
  'super_admin': '총 관리자',
  'teacher':     '교사',
};

/* ── 인증 상태 감지 ── */
auth.onAuthStateChanged(async user => {
  if (!user) {
    _showLoginForm();
    return;
  }

  /* forceRefresh: true — 로그인 직후 최신 Custom Claim 보장
     기존 세션에서 Claim이 새로 부여된 경우에도 즉시 반영 */
  const tokenResult = await user.getIdTokenResult(/* forceRefresh */ true);
  const role        = tokenResult.claims.role ?? null;

  if (role !== 'teacher' && role !== 'super_admin') {
    /* 계정은 있으나 교사 role이 없는 경우 */
    _showLoginForm();
    setError('이 계정에는 교사 권한이 없어요. 관리자에게 문의해주세요.');
    await auth.signOut();
    return;
  }

  _showLoggedIn(user, role);
});

/* ── 로그인 ── */
btnLogin.addEventListener('click', _doLogin);
pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') _doLogin(); });
emailInput.addEventListener('keydown', e => { if (e.key === 'Enter') pwInput.focus(); });

async function _doLogin() {
  const email = emailInput.value.trim();
  const pw    = pwInput.value;
  if (!email || !pw) { setError('이메일과 비밀번호를 모두 입력해주세요.'); return; }

  setError('');
  btnLogin.disabled    = true;
  btnLogin.textContent = '확인 중...';

  try {
    await auth.signInWithEmailAndPassword(email, pw);
    /* onAuthStateChanged가 role 확인 후 화면 전환 처리 */
  } catch (err) {
    btnLogin.disabled    = false;
    btnLogin.textContent = '로그인 →';
    setError(_authErrMsg(err.code));
  }
}

/* ── 관리 화면으로 이동 ── */
btnEnter.addEventListener('click', () => {
  window.location.href = 'maker.html?admin=1';
});

/* ── 로그아웃 ── */
btnLogout.addEventListener('click', async () => {
  await auth.signOut();
});

/* ── 헬퍼 ── */
function _showLoginForm() {
  loginForm.style.display    = '';
  loggedInView.style.display = 'none';
  btnLogin.disabled    = false;
  btnLogin.textContent = '로그인 →';
}

function _showLoggedIn(user, role) {
  loginForm.style.display    = 'none';
  loggedInView.style.display = 'block';
  loggedInName.textContent   = user.email;
  loggedInRole.textContent   = ROLE_LABEL[role] ?? role;
  setError('');
}

function setError(msg) {
  authError.textContent = msg;
}

function _authErrMsg(code) {
  const map = {
    'auth/user-not-found':     '등록된 계정이 없어요.',
    'auth/wrong-password':     '비밀번호가 틀렸어요.',
    'auth/invalid-email':      '이메일 형식이 올바르지 않아요.',
    'auth/invalid-credential': '이메일 또는 비밀번호가 올바르지 않아요.',
    'auth/too-many-requests':  '로그인 시도가 너무 많아요. 잠시 후 다시 시도해주세요.',
    'auth/user-disabled':      '비활성화된 계정이에요. 관리자에게 문의해주세요.',
  };
  return map[code] ?? `로그인 실패: ${code}`;
}
</script>
</body>
</html>
