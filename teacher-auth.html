<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <!-- v36: PWA — 홈 화면에 추가하면 전체화면 앱처럼 동작 -->
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#fbf6ea"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="가지"/>
  <title>가지 branch — 교사 로그인</title>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet"/>
  <style>
    /* W8 Warm Paper: 선생님 영역 — index.html, maker join, viewer entry와 같은 종이톤.
       선생님 강조색은 골드 — index.html admin 카드와 일치. 진엽서/공책 느낌. */
    :root {
      --bg:        #fbf6ea;
      --paper-2:   #f4ecd8;
      --cream:     #fffaee;
      --line:      rgba(80,50,20,0.10);
      --line-2:    rgba(80,50,20,0.18);
      --ink:       #2b1f10;
      --ink-2:     #4a3820;
      --ink-3:     #6b5638;
      --pencil:    #9a8868;
      --primary:   #c79550;     /* 선생님 영역 강조색 (골드/오커) */
      --primary-2: #d6a868;
      --primary-fg:#2b1f10;
      --error:     #c8503c;
      --success:   #5a8a4a;     /* 종이톤에 어울리는 진녹 */
      --radius:    16px;
      --font-h:    'Jua', sans-serif;
      --font-b:    'Nanum Gothic', sans-serif;
      --font-hand: 'Nanum Pen Script', cursive;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{
      font-family:var(--font-b);background:var(--bg);color:var(--ink);
      min-height:100vh;display:flex;align-items:center;justify-content:center;
      padding:20px;
      position:relative;overflow-x:hidden;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(120,90,50,0.025) 0, transparent 50%),
        radial-gradient(circle at 70% 70%, rgba(120,90,50,0.020) 0, transparent 50%);
    }
    /* 종이 테이프 장식 (home/maker join/viewer entry와 통일) */
    body::before{
      content:'';position:fixed;top:32px;left:50%;
      transform:translateX(-50%) rotate(-2deg);
      width:100px;height:18px;
      background:rgba(232,164,64,0.40);
      border-radius:2px;
      box-shadow:0 1px 2px rgba(120,90,50,0.10);
      opacity:0.7;
      pointer-events:none;
      z-index:0;
    }

    .auth-wrap {
      width:100%;max-width:400px;
      position:relative;z-index:1;
    }

    /* 브랜드 */
    .auth-brand {
      text-align:center;margin-bottom:24px;
    }
    .auth-brand-logo {
      font-family:var(--font-h);font-size:30px;color:var(--ink);
      letter-spacing:-0.005em;
    }
    .auth-brand-logo-accent {
      color:var(--primary);
    }
    .auth-brand-sub {
      font-family:var(--font-hand);
      font-size:20px;color:var(--primary);
      margin-bottom:6px;
      letter-spacing:0.02em;
      line-height:1;
    }

    /* 카드 */
    .auth-card {
      position:relative;
      background:var(--cream);
      border:1px solid var(--line);
      border-radius:20px;
      padding:32px 28px;
      box-shadow:
        0 1px 0 rgba(120,90,50,0.06),
        0 2px 6px rgba(120,90,50,0.06),
        0 16px 32px rgba(120,90,50,0.10);
      animation:authFadeUp 0.5s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes authFadeUp{
      from{opacity:0;transform:translateY(16px);}
      to{opacity:1;transform:translateY(0);}
    }
    .auth-card-title {
      font-family:var(--font-h);font-size:18px;color:var(--ink);
      margin-bottom:20px;text-align:center;
    }

    /* 입력 */
    .auth-field {
      margin-bottom:14px;
    }
    .auth-label {
      display:block;font-size:12px;color:var(--ink-3);
      margin-bottom:6px;font-family:var(--font-h);letter-spacing:0.03em;
    }
    .auth-input {
      width:100%;padding:12px 16px;
      background:#fdf8eb;
      border:1.5px solid var(--line-2);
      border-radius:14px;
      font-family:var(--font-b);font-size:15px;
      color:var(--ink);
      transition:border-color 180ms,background 180ms,box-shadow 180ms;
    }
    .auth-input::placeholder{color:var(--pencil);}
    .auth-input:focus{
      outline:none;
      border-color:var(--primary);
      background:var(--cream);
      box-shadow:0 0 0 3px rgba(199,149,80,0.20);
    }

    /* 버튼 */
    .auth-btn {
      width:100%;padding:13px;
      background:var(--primary);color:var(--primary-fg);
      border:none;border-radius:999px;
      font-family:var(--font-h);font-size:16px;cursor:pointer;
      margin-top:6px;
      box-shadow:0 1px 2px rgba(120,90,50,0.10),0 4px 12px rgba(199,149,80,0.24);
      transition:filter 180ms,transform 80ms,box-shadow 180ms;
      font-weight:400;
    }
    .auth-btn:hover{
      filter:brightness(1.05);
      box-shadow:0 4px 12px rgba(120,90,50,0.14),0 8px 24px rgba(199,149,80,0.30);
    }
    .auth-btn:active{transform:translateY(1px);}
    .auth-btn:disabled{opacity:.55;cursor:not-allowed;filter:none;box-shadow:0 1px 2px rgba(120,90,50,0.08);}

    /* 에러 / 상태 */
    .auth-error {
      font-size:13px;color:var(--error);margin-top:12px;
      text-align:center;min-height:20px;line-height:1.5;
      font-family:var(--font-h);
    }
    .auth-notice {
      font-size:12px;color:var(--ink-3);margin-top:16px;
      text-align:center;line-height:1.7;
      padding-top:14px;
      border-top:1px dashed var(--line);
    }

    /* 로그인 완료 상태 */
    .auth-logged-in {
      text-align:center;display:none;
    }
    .auth-logged-in-icon { font-size:48px;margin-bottom:12px; }
    .auth-logged-in-name {
      font-family:var(--font-h);font-size:18px;color:var(--ink);margin-bottom:4px;
    }
    .auth-logged-in-role {
      font-size:12px;color:var(--ink-3);margin-bottom:20px;letter-spacing:0.05em;
    }
    .auth-btn--enter {
      background:var(--success);color:#fffaee;margin-bottom:10px;
      box-shadow:0 1px 2px rgba(120,90,50,0.10),0 4px 12px rgba(90,138,74,0.24);
    }
    .auth-btn--enter:hover{
      background:#6b9b5a;
      box-shadow:0 4px 12px rgba(120,90,50,0.14),0 8px 24px rgba(90,138,74,0.30);
    }
    .auth-btn--logout {
      background:var(--paper-2);
      color:var(--ink-2);
      border:1px solid var(--line-2);
      box-shadow:none;
    }
    .auth-btn--logout:hover{
      background:#ebe0c6;color:var(--ink);
      box-shadow:none;
      filter:none;
    }

    /* 홈 링크 */
    .auth-home-link {
      display:block;text-align:center;margin-top:18px;
      font-size:12px;color:var(--ink-3);text-decoration:none;
      transition:color 150ms;
    }
    .auth-home-link:hover{color:var(--primary);}
  </style>
</head>
<body>

<div class="auth-wrap">

  <!-- 브랜드 -->
  <div class="auth-brand">
    <div class="auth-brand-sub">ㅡ 한 학기를 책임지는 ㅡ</div>
    <div class="auth-brand-logo">가지 <span class="auth-brand-logo-accent">교사 관리</span></div>
  </div>

  <!-- 카드 -->
  <div class="auth-card">

    <!-- 로그인 폼 -->
    <div id="login-form">
      <div class="auth-card-title" id="form-title">교사 계정으로 로그인</div>
      <div class="auth-field">
        <label class="auth-label" for="auth-email">이메일</label>
        <input id="auth-email" class="auth-input" type="email"
          placeholder="teacher@school.kr" autocomplete="email"/>
      </div>
      <div class="auth-field">
        <label class="auth-label" for="auth-pw">비밀번호</label>
        <input id="auth-pw" class="auth-input" type="password"
          placeholder="비밀번호" autocomplete="current-password"/>
      </div>
      <!-- v90: 가입 모드에서만 보임 — 비밀번호 확인 + 약관 동의 -->
      <div class="auth-field" id="signup-only-pw-confirm" style="display:none;">
        <label class="auth-label" for="auth-pw-confirm">비밀번호 확인</label>
        <input id="auth-pw-confirm" class="auth-input" type="password"
          placeholder="다시 한 번" autocomplete="new-password"/>
      </div>
      <div id="signup-only-terms" style="display:none;margin:10px 0;font-size:13px;color:var(--ink-3);line-height:1.5;">
        <label style="display:flex;align-items:flex-start;gap:8px;cursor:pointer;">
          <input id="auth-terms" type="checkbox" style="margin-top:3px;flex-shrink:0;"/>
          <span>이메일은 <strong>로그인 + 비밀번호 복구</strong> 용도로만 사용해요.
            이름·학교·소속 정보는 수집하지 않아요.<br/>
            <a href="./privacy.html" target="_blank" rel="noopener"
               style="color:var(--ink-3);text-decoration:underline;">개인정보 처리방침</a>을 확인하고 동의합니다.</span>
        </label>
      </div>
      <button id="btn-login" class="auth-btn">로그인 →</button>
      <div id="auth-error" class="auth-error"></div>

      <!-- v90: 비밀번호 재설정 링크 (로그인 모드만) -->
      <div id="login-only-links" style="text-align:center;margin-top:14px;font-size:13px;">
        <a href="#" id="btn-forgot-pw" style="color:var(--ink-3);text-decoration:underline;cursor:pointer;">
          비밀번호를 잊으셨나요?
        </a>
      </div>

      <!-- v90: 가입/로그인 모드 전환 -->
      <div style="display:flex;align-items:center;gap:10px;margin:18px 0;">
        <div style="flex:1;height:1px;background:var(--line-2);"></div>
        <div style="color:var(--ink-3);font-size:12px;">또는</div>
        <div style="flex:1;height:1px;background:var(--line-2);"></div>
      </div>

      <!-- v90: Google 로그인 -->
      <button id="btn-google" class="auth-btn" style="background:#fff;color:#3c4043;border:1.5px solid #dadce0;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:500;">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        <span id="btn-google-label">Google로 로그인</span>
      </button>

      <!-- v90: 가입/로그인 전환 -->
      <p class="auth-notice" style="margin-top:18px;">
        <span id="toggle-mode-text">아직 계정이 없으세요?</span>
        <a href="#" id="btn-toggle-mode" style="color:var(--primary);text-decoration:underline;cursor:pointer;font-weight:600;">회원가입</a>
      </p>
    </div>

    <!-- 로그인 완료 상태 -->
    <div id="logged-in-view" class="auth-logged-in">
      <div class="auth-logged-in-icon">✅</div>
      <div id="logged-in-name" class="auth-logged-in-name">-</div>
      <div id="logged-in-role" class="auth-logged-in-role">-</div>
      <div id="logged-in-class" class="auth-logged-in-role" style="margin-top:6px;color:var(--ink-3);font-size:13px;"></div>
      <button id="btn-enter-admin" class="auth-btn auth-btn--enter">
        관리 화면으로 →
      </button>
      <button id="btn-logout" class="auth-btn auth-btn--logout">
        로그아웃
      </button>
    </div>

    <!-- v92: 클래스 만들기 화면 — 가입 후 자기 클래스 없으면 박힘 -->
    <div id="create-class-view" style="display:none;">
      <div class="auth-card-title">🎒 우리반 클래스를 만들어요</div>
      <p style="color:var(--ink-3);font-size:13px;line-height:1.5;margin-bottom:18px;">
        한 번만 만들면 돼요. 학생들이 클래스 코드를 입력해서 작품을 만들 수 있어요.
      </p>
      <div class="auth-field">
        <label class="auth-label" for="class-name">반 이름 <span style="color:var(--pencil);font-weight:normal;">(자유)</span></label>
        <input id="class-name" class="auth-input" type="text"
          placeholder="예: 송파초 3-2반" maxlength="40"/>
      </div>
      <div class="auth-field">
        <label class="auth-label" for="class-code">클래스 코드 <span style="color:var(--pencil);font-weight:normal;">(학생이 입력)</span></label>
        <input id="class-code" class="auth-input" type="text"
          placeholder="예: JL26A" maxlength="6" autocapitalize="characters"
          style="text-transform:uppercase;letter-spacing:0.1em;"/>
        <div id="class-code-status" style="margin-top:6px;font-size:12px;color:var(--ink-3);min-height:16px;">
          영문 + 숫자 4~6자 (대소문자 구분 X)
        </div>
      </div>
      <button id="btn-create-class" class="auth-btn">만들기 →</button>
      <div id="create-class-error" class="auth-error"></div>
      <p class="auth-notice" style="margin-top:14px;">
        <a href="#" id="btn-create-class-logout" style="color:var(--ink-3);text-decoration:underline;cursor:pointer;font-size:12px;">
          다른 계정으로 다시 로그인
        </a>
      </p>
    </div>

  </div>

  <a href="index.html" class="auth-home-link">🌿 처음으로</a>

  <p style="text-align:center;margin:10px 0 0;font-size:12px;">
    <a href="./privacy.html" target="_blank" rel="noopener"
       style="color:var(--ink-3);text-decoration:none;border-bottom:1px dashed var(--ink-3);padding-bottom:1px;opacity:0.8;">개인정보 처리방침</a>
  </p>

</div>

<!-- 전체 화면 유지(멀티페이지) 공유 모듈 — 로그인 후 이동에도 전체화면 재진입 -->
<script src="fullscreen-persist.js?v=fspersist1"></script>
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
/* ================================================================
   teacher-auth.html — 교사 로그인 전용 화면
   ─────────────────────────────────────────────────────────────────
   역할:
     Firebase Auth 이메일/비밀번호 로그인
     Custom Claim의 role 확인 (teacher | super_admin)
     인증 성공 → maker.html?admin=1 으로 이동
   ─────────────────────────────────────────────────────────────────
   임시 구조 메모:
     admin/pw fallback 제거됨. Firebase Auth 단일 경로만 사용.
   ================================================================ */

const firebaseConfig = {
  apiKey:            'AIzaSyBK12nBkj6Pdwu-zpL3w0krU1PzS78McmE',
  authDomain:        'picturebook-8731f.firebaseapp.com',
  projectId:         'picturebook-8731f',
  storageBucket:     'picturebook-8731f.firebasestorage.app',
  messagingSenderId: '590974087190',
  appId:             '1:590974087190:web:a9e9ba15adf020ff470537'
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.database();
const googleProvider = new firebase.auth.GoogleAuthProvider();

/* v90: 가입 모드 토글 — false = 로그인, true = 회원가입 */
let _signupMode = false;

/* ── DOM 참조 ── */
const loginForm     = document.getElementById('login-form');
const loggedInView  = document.getElementById('logged-in-view');
const emailInput    = document.getElementById('auth-email');
const pwInput       = document.getElementById('auth-pw');
const btnLogin      = document.getElementById('btn-login');
const btnEnter      = document.getElementById('btn-enter-admin');
const btnLogout     = document.getElementById('btn-logout');
const authError     = document.getElementById('auth-error');
const loggedInName  = document.getElementById('logged-in-name');
const loggedInRole  = document.getElementById('logged-in-role');

const ROLE_LABEL = {
  'super_admin': '총 관리자',
  'teacher':     '교사',
};

/* ── 인증 상태 감지 ──
   v90: Custom Claim 외에 teachers/{uid} 노드도 확인. 신규 가입자는
   가입 직후 teachers 노드에 박힘 (Cloud Functions 없이 클라이언트가 직접).
   v92: 인증 후 teacherClasses/{uid} 조회 — 없으면 클래스 만들기 화면. */
auth.onAuthStateChanged(async user => {
  if (!user) {
    _showLoginForm();
    return;
  }

  /* forceRefresh: true — 로그인 직후 최신 Custom Claim 보장 */
  const tokenResult = await user.getIdTokenResult(/* forceRefresh */ true);
  const claim = tokenResult.claims.role ?? null;

  /* v90: claim 없으면 teachers 노드 확인 (신규 가입자) */
  let teacherViaNode = false;
  if (!claim) {
    try {
      const snap = await db.ref('teachers/' + user.uid).once('value');
      teacherViaNode = snap.exists();
    } catch (e) { /* 룰 거부면 false 유지 */ }
  }

  const role = claim || (teacherViaNode ? 'teacher' : null);

  if (role !== 'teacher' && role !== 'super_admin') {
    _showLoginForm();
    setError('이 계정에는 교사 권한이 없어요. 관리자에게 문의해주세요.');
    await auth.signOut();
    return;
  }

  /* v92: super_admin은 클래스 없어도 OK (옛 흐름). 일반 teacher만 클래스 검증. */
  if (role === 'teacher') {
    let classId = null;
    try {
      const snap = await db.ref('teacherClasses/' + user.uid).once('value');
      classId = snap.val();
    } catch (e) { /* 룰 거부면 null 유지 */ }

    if (!classId) {
      _showCreateClass(user);
      return;
    }
  }

  _showLoggedIn(user, role);
});

/* ── 로그인/가입 분기 핸들러 ── */
btnLogin.addEventListener('click', () => _signupMode ? _doSignup() : _doLogin());
pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') (_signupMode ? _doSignup() : _doLogin()); });
emailInput.addEventListener('keydown', e => { if (e.key === 'Enter') pwInput.focus(); });

/* v90: 가입/로그인 모드 전환 */
document.getElementById('btn-toggle-mode').addEventListener('click', e => {
  e.preventDefault();
  _signupMode = !_signupMode;
  document.getElementById('form-title').textContent = _signupMode ? '교사 회원가입' : '교사 계정으로 로그인';
  btnLogin.textContent = _signupMode ? '가입하기 →' : '로그인 →';
  document.getElementById('signup-only-pw-confirm').style.display = _signupMode ? '' : 'none';
  document.getElementById('signup-only-terms').style.display = _signupMode ? '' : 'none';
  document.getElementById('login-only-links').style.display = _signupMode ? 'none' : '';
  document.getElementById('btn-google-label').textContent = _signupMode ? 'Google로 가입' : 'Google로 로그인';
  document.getElementById('toggle-mode-text').textContent = _signupMode ? '이미 계정이 있으세요?' : '아직 계정이 없으세요?';
  e.target.textContent = _signupMode ? '로그인' : '회원가입';
  pwInput.setAttribute('autocomplete', _signupMode ? 'new-password' : 'current-password');
  setError('');
});

async function _doLogin() {
  const email = emailInput.value.trim();
  const pw    = pwInput.value;
  if (!email || !pw) { setError('이메일과 비밀번호를 모두 입력해주세요.'); return; }

  setError('');
  btnLogin.disabled    = true;
  btnLogin.textContent = '확인 중...';

  try {
    await auth.signInWithEmailAndPassword(email, pw);
  } catch (err) {
    btnLogin.disabled    = false;
    btnLogin.textContent = '로그인 →';
    setError(_authErrMsg(err.code));
  }
}

/* v90: 이메일 회원가입 — 가입 즉시 teachers/{uid} 박음 → 자동 교사 권한 */
async function _doSignup() {
  const email = emailInput.value.trim();
  const pw    = pwInput.value;
  const pw2   = document.getElementById('auth-pw-confirm').value;
  const agreed = document.getElementById('auth-terms').checked;

  if (!email || !pw) { setError('이메일과 비밀번호를 모두 입력해주세요.'); return; }
  if (pw.length < 6) { setError('비밀번호는 6자 이상이어야 해요.'); return; }
  if (pw !== pw2)    { setError('비밀번호 확인이 일치하지 않아요.'); return; }
  if (!agreed)       { setError('약관에 동의해주세요.'); return; }

  setError('');
  btnLogin.disabled    = true;
  btnLogin.textContent = '가입 중...';

  try {
    const cred = await auth.createUserWithEmailAndPassword(email, pw);
    await _registerTeacherNode(cred.user);
    /* onAuthStateChanged가 자동으로 화면 전환 */
  } catch (err) {
    btnLogin.disabled    = false;
    btnLogin.textContent = '가입하기 →';
    setError(_authErrMsg(err.code));
  }
}

/* v90: Google 로그인/가입 — 같은 버튼에서 둘 다 처리.
   가입 모드면 약관 체크 확인, 신규 사용자면 teachers 노드 박음. */
document.getElementById('btn-google').addEventListener('click', async () => {
  if (_signupMode && !document.getElementById('auth-terms').checked) {
    setError('약관에 동의해주세요.');
    return;
  }
  setError('');
  try {
    const result = await auth.signInWithPopup(googleProvider);
    /* 신규 사용자면 teachers 노드 박음 (기존 사용자는 onAuthStateChanged에서 통과) */
    if (result.additionalUserInfo?.isNewUser) {
      await _registerTeacherNode(result.user);
    }
  } catch (err) {
    setError(_authErrMsg(err.code));
  }
});

/* v90: 비밀번호 재설정 — Firebase 자체 이메일 발송. */
document.getElementById('btn-forgot-pw').addEventListener('click', async e => {
  e.preventDefault();
  const email = emailInput.value.trim();
  if (!email) {
    setError('이메일 입력란에 이메일을 적은 후 다시 눌러주세요.');
    emailInput.focus();
    return;
  }
  try {
    await auth.sendPasswordResetEmail(email);
    setError('');
    alert(`${email}로 비밀번호 재설정 메일을 보냈어요. 메일함을 확인해주세요.`);
  } catch (err) {
    setError(_authErrMsg(err.code));
  }
});

/* v90: 신규 가입자 teachers 노드 박는 helper.
   Custom Claim 안 박고 노드 기반으로 교사 검증. createdAt만 박음. */
async function _registerTeacherNode(user) {
  try {
    await db.ref('teachers/' + user.uid).set({
      email:     user.email || '',
      createdAt: firebase.database.ServerValue.TIMESTAMP,
    });
  } catch (e) {
    console.warn('[teachers node] set failed', e);
  }
}

/* ── 관리 화면으로 이동 ── */
btnEnter.addEventListener('click', () => {
  window.location.href = 'maker.html?admin=1';
});

/* ── 로그아웃 ── */
btnLogout.addEventListener('click', async () => {
  await auth.signOut();
});

/* ── 헬퍼 ── */
function _showLoginForm() {
  loginForm.style.display    = '';
  loggedInView.style.display = 'none';
  document.getElementById('create-class-view').style.display = 'none';
  btnLogin.disabled    = false;
  btnLogin.textContent = _signupMode ? '가입하기 →' : '로그인 →';
}

async function _showLoggedIn(user, role) {
  loginForm.style.display    = 'none';
  loggedInView.style.display = 'block';
  document.getElementById('create-class-view').style.display = 'none';
  loggedInName.textContent   = user.email;
  loggedInRole.textContent   = ROLE_LABEL[role] ?? role;
  /* v92: 클래스 정보 표시 (teacher만) */
  const classEl = document.getElementById('logged-in-class');
  if (classEl) classEl.textContent = '';
  if (role === 'teacher') {
    try {
      const classId = (await db.ref('teacherClasses/' + user.uid).once('value')).val();
      if (classId) {
        const meta = (await db.ref('classes/' + classId + '/meta').once('value')).val() || {};
        const code = meta.code || '';
        const name = meta.name || '';
        if (classEl && code) classEl.textContent = `${name ? name + ' · ' : ''}코드: ${code}`;
      }
    } catch (e) { /* skip */ }
  }
  setError('');
}

/* v92: 클래스 만들기 화면 박기 */
function _showCreateClass(user) {
  loginForm.style.display    = 'none';
  loggedInView.style.display = 'none';
  document.getElementById('create-class-view').style.display = 'block';
  document.getElementById('class-name').value = '';
  document.getElementById('class-code').value = '';
  document.getElementById('class-code-status').textContent = '영문 + 숫자 4~6자 (대소문자 구분 X)';
  document.getElementById('class-code-status').style.color = 'var(--ink-3)';
  document.getElementById('create-class-error').textContent = '';
  _currentUserForCreate = user;
}
let _currentUserForCreate = null;

/* v92: 클래스 코드 실시간 중복 검증 (입력 박힌 후 300ms 디바운스) */
let _codeCheckTimer = null;
let _codeAvailable = false;
document.getElementById('class-code').addEventListener('input', e => {
  const raw = e.target.value.trim().toUpperCase();
  e.target.value = raw;
  const status = document.getElementById('class-code-status');
  _codeAvailable = false;

  if (!raw) {
    status.textContent = '영문 + 숫자 4~6자 (대소문자 구분 X)';
    status.style.color = 'var(--ink-3)';
    return;
  }
  if (!/^[A-Z0-9]{4,6}$/.test(raw)) {
    status.textContent = '⚠ 영문 대문자 + 숫자 4~6자만 가능';
    status.style.color = 'var(--error)';
    return;
  }

  status.textContent = '⏳ 확인 중...';
  status.style.color = 'var(--ink-3)';
  if (_codeCheckTimer) clearTimeout(_codeCheckTimer);
  _codeCheckTimer = setTimeout(async () => {
    try {
      const snap = await db.ref('classCodes/' + raw).once('value');
      if (snap.exists()) {
        status.textContent = '✗ 이미 다른 반이 쓰고 있어요. 다른 코드로 박아주세요.';
        status.style.color = 'var(--error)';
        _codeAvailable = false;
      } else {
        status.textContent = '✓ 사용 가능';
        status.style.color = 'var(--success)';
        _codeAvailable = true;
      }
    } catch (e) {
      status.textContent = '확인 실패. 다시 시도해주세요.';
      status.style.color = 'var(--error)';
    }
  }, 300);
});

/* v92: 클래스 만들기 — 3개 노드 atomic update.
   classId = cls_${timestamp36}_${uid 앞 6글자}. 사람이 읽을 일 없는 내부 식별자. */
document.getElementById('btn-create-class').addEventListener('click', async () => {
  const btn = document.getElementById('btn-create-class');
  const errEl = document.getElementById('create-class-error');
  const name = document.getElementById('class-name').value.trim();
  const code = document.getElementById('class-code').value.trim().toUpperCase();
  const user = _currentUserForCreate || auth.currentUser;

  errEl.textContent = '';
  if (!user) { errEl.textContent = '로그인이 필요해요.'; return; }
  if (!/^[A-Z0-9]{4,6}$/.test(code)) { errEl.textContent = '클래스 코드는 영문 대문자 + 숫자 4~6자여야 해요.'; return; }
  if (!_codeAvailable) { errEl.textContent = '코드 중복 확인이 끝난 후 박아주세요.'; return; }

  btn.disabled = true;
  btn.textContent = '만드는 중...';

  const classId = `cls_${Date.now().toString(36)}_${user.uid.slice(0, 6)}`;
  const meta = {
    teacher_uid: user.uid,
    teacher_email: user.email || '',
    code: code,
    name: name || '',
    createdAt: firebase.database.ServerValue.TIMESTAMP,
  };

  /* v92: 2단계 update — Firebase rules가 root 참조해서 검증하므로 한 번 atomic
     update로는 classCodes/teacherClasses 룰이 classes/.../meta 못 봄.
     1단계: classes/{classId}/meta 박음 (룰: 자기 uid).
     2단계: classCodes + teacherClasses 박음 (룰: root.classes 검증, 1단계 박혀있음). */
  try {
    /* 1단계 */
    await db.ref(`classes/${classId}/meta`).set(meta);
    /* 2단계 — ACCOUNT-MODE-DEFAULT-1: 신규 학급 기본값을 teacher_managed로 명시 기록
       (오타·장난 팀 무한 생성 차단). 전역 fallback(legacy_open)은 불변 — 기존 학급 무영향.
       settings write 룰은 root.classes/{id}/meta/teacher_uid===uid를 보는데 1단계에서 이미
       커밋됐으므로 통과, teamCreationMode child .validate('teacher_managed')도 통과.
       원자 update라 검증 실패 시 학급 생성 전체 롤백(부분 생성 없음). */
    await db.ref().update({
      [`classCodes/${code}`]:         classId,
      [`teacherClasses/${user.uid}`]: classId,
      [`classes/${classId}/settings/teamCreationMode`]: 'teacher_managed',
    });
    /* 성공 → 인증 화면 */
    await _showLoggedIn(user, 'teacher');
  } catch (e) {
    btn.disabled = false;
    btn.textContent = '만들기 →';
    errEl.textContent = '만들기 실패: ' + (e.message || e.code || '알 수 없는 오류');
    console.warn('[create class]', e);
  }
});

/* v92: 클래스 만들기 화면에서 로그아웃 */
document.getElementById('btn-create-class-logout').addEventListener('click', async e => {
  e.preventDefault();
  await auth.signOut();
});

function setError(msg) {
  authError.textContent = msg;
}

function _authErrMsg(code) {
  const map = {
    'auth/user-not-found':       '등록된 계정이 없어요.',
    'auth/wrong-password':       '비밀번호가 틀렸어요.',
    'auth/invalid-email':        '이메일 형식이 올바르지 않아요.',
    'auth/invalid-credential':   '이메일 또는 비밀번호가 올바르지 않아요.',
    'auth/too-many-requests':    '시도가 너무 많아요. 잠시 후 다시 시도해주세요.',
    'auth/user-disabled':        '비활성화된 계정이에요. 관리자에게 문의해주세요.',
    /* v90: 가입/Google 에러 */
    'auth/email-already-in-use': '이미 가입된 이메일이에요. 로그인으로 진행해주세요.',
    'auth/weak-password':        '비밀번호는 6자 이상이어야 해요.',
    'auth/popup-closed-by-user': 'Google 로그인 창이 닫혔어요.',
    'auth/popup-blocked':        'Google 로그인 팝업이 차단됐어요. 팝업 허용 후 다시 시도해주세요.',
    'auth/operation-not-allowed':'이 로그인 방식은 현재 지원되지 않아요. 관리자에게 문의해주세요.',
  };
  return map[code] ?? `오류: ${code}`;
}
