  <!-- W8: 자동 진입(?team= 있을 때) 깜빡임 차단.
       maker → "감상 테스트" / "다듬기" 진입 시 entry 화면이 잠깐 보였다가 사라지는 현상 제거.
       JS 로드 전에 inline으로 처리 — CSS의 #entry-screen{display:flex} 효과 무력화. -->
  <script>
    (function () {
      try {
        var p = new URLSearchParams(location.search);
        if (p.get('team')) {
          var s = document.createElement('style');
          s.textContent = ''
            + '#entry-screen{display:none !important;}'
            + '#auto-enter-loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;'
            + 'background:#fbf6ea;font-family:\'Jua\',sans-serif;color:#6b5638;font-size:14px;letter-spacing:0.02em;z-index:200;}'
            + '#auto-enter-loading.fade-out{opacity:0;transition:opacity 0.25s ease-out;pointer-events:none;}';
          document.head.appendChild(s);
          /* 로딩 표시 — body 첫 자식으로 박기 (DOMContentLoaded 후 추가) */
          document.addEventListener('DOMContentLoaded', function () {
            if (document.getElementById('auto-enter-loading')) return;
            var el = document.createElement('div');
            el.id = 'auto-enter-loading';
            el.textContent = '작품을 불러오는 중…';
            document.body.appendChild(el);
          });
          /* viewer-entry.js가 _enterViewer 완료 후 player 렌더 끝나면 이 함수가 로딩 제거 */
          window.__hideAutoEnterLoading = function () {
            var el = document.getElementById('auto-enter-loading');
            if (!el) return;
            el.classList.add('fade-out');
            setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 280);
          };
        }
      } catch (e) { /* noop */ }
    })();
  </script>
</head>

<!-- ═══════════════════════════════════════════
     ENTRY 화면
     ═══════════════════════════════════════════ -->
<div id="entry-screen">
  <div class="entry-card">
    <p class="entry-logo">ㅡ 친구의 이야기를 ㅡ</p>
    <h1 class="entry-title">작품 보기</h1>
    <p class="entry-sub">
      클래스 코드와 팀 이름을 입력하면<br/>
      완성된 작품을 감상할 수 있어요
    </p>
    <input
      id="entry-code-input"
      class="entry-input entry-input--code"
      type="text"
      placeholder="클래스 코드 (예: JL26A)"
      maxlength="10"
      autocomplete="off"
      style="text-transform:uppercase;letter-spacing:2px;"
    />
    <input
      id="entry-team-input"
      class="entry-input"
      type="text"
      placeholder="팀 이름 (예: 2모둠)"
      maxlength="30"
      autocomplete="off"
    />
    <div id="entry-error" class="entry-error"></div>
    <button id="entry-submit" class="entry-submit">작품 보기 →</button>
    <!-- 2026-05-25: 태블릿 앱모드에서 처음 메뉴로 안전하게 돌아갈 경로 -->
    <a href="index.html" class="entry-home-link"
       style="display:inline-block; margin-top:14px; font-family:'Jua',sans-serif; font-size:13px; color:rgba(255,255,255,0.55); text-decoration:none; padding:6px 14px; border:1px dashed rgba(255,255,255,0.2); border-radius:6px; transition:color .15s, border-color .15s, background .15s;"
       onmouseover="this.style.color='rgba(255,255,255,0.85)';this.style.borderColor='rgba(255,255,255,0.4)';"
       onmouseout="this.style.color='rgba(255,255,255,0.55)';this.style.borderColor='rgba(255,255,255,0.2)';"
    >← 처음 메뉴로</a>
    <p style="margin:12px 0 0;font-size:12px;">
      <a href="./privacy.html" target="_blank" rel="noopener"
         style="color:rgba(255,255,255,0.5);text-decoration:none;border-bottom:1px dashed rgba(255,255,255,0.25);padding-bottom:1px;">개인정보 처리방침</a>
    </p>
  </div>
</div>

<!-- ═══════════════════════════════════════════
     PLAYER 화면
     ═══════════════════════════════════════════ -->
<div id="player-screen" class="hidden">

  <!-- HUD (상단 바) -->
  <div id="hud"></div>

  <!-- PANEL-BACKBONE-1B: 잠금 안내/인수 배너(#edit-panel 밖). _applyEditLockUI가 잠금 시 채우고
       비잠금 시 비움(:empty→display:none). 강제(body.viewer-edit-readonly)·lock 함수(viewer-locks.js)는 무관.
       기존 content탭 내부 배너는 display:none이라 사실상 안 보였음 → 가시성 복구. -->
  <div id="edit-lock-alert" class="edit-lock-banner" role="alert" aria-live="polite"></div>

  <!-- PANEL-BACKBONE-1A-i: HUD 아래 독립 장면 이동 바(#edit-panel 밖). edit 모드에서만
       renderSceneNavigator가 _sceneNavigatorHtml를 주입. 빈 상태(:empty)면 공간 차지 X. -->
  <div id="scene-navigator" class="scene-navigator" aria-label="장면 이동"></div>

  <!-- 본문 영역 -->
  <div class="player-body">

    <!-- 풀스크린 stage: 검은 배경 -->
    <div id="stage-wrap">
      <!-- 16:9 작품 무대 프레임 -->
      <div id="viewer-frame" class="stage theme-default">
        <!-- 장면 콘텐츠가 여기 렌더됨 -->
        <!-- safe-area 점선 (edit 모드에서만 표시) — viewer-frame 기준 -->
        <div id="safe-area-hint" class="safe-area-hint hidden"></div>
      </div>
    </div>

    <!-- edit panel (editMode일 때만 표시) -->
    <div id="edit-panel"></div>

    <!-- v47: 인스펙터 토글 — 다듬기 모드에서만 보임 (CSS) -->
    <button class="edit-panel-toggle" id="edit-panel-toggle"
      title="인스펙터 펼치기/접기" aria-label="인스펙터 펼치기/접기">◀</button>

  </div>
</div>

<!-- v123: 루트보기 패널 (다듬기 화면 안에서도 열림). maker.html과 동일 구조. -->
<div id="route-panel" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:400;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto;">
  <div style="background:#fff;border-radius:20px;width:100%;max-width:600px;box-shadow:0 16px 48px rgba(0,0,0,.25);overflow:hidden;">

      <div>
        <div style="font-family:'Jua',sans-serif;font-size:20px;color:#fff;">🛤 루트 보기</div>
        <div style="font-size:12px;color:rgba(255,255,255,.8);margin-top:2px;">엔딩별로 이야기 흐름을 읽어보며 점검하는 도구</div>
      </div>
      <button id="btn-route-close" style="background:rgba(255,255,255,.2);border:none;color:#fff;width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer;">✕</button>

    </div>

</div>

<!-- TOP-TOOLBAR-2A: 일반 장면 "🔗 버튼" 상단 팝오버 — 행동 버튼 개수/선택지 연결을
