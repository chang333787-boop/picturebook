<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <!-- WRITE-AFTER-VIEWER-HTML-CACHE-HARDENED: 진입 HTML이 오래 캐시돼 옛 JS cachebuster(AI_SRC 등)로
       옛 번들을 로드하던 문제 방지. http-equiv meta는 GitHub Pages HTTP 헤더를 완전히 못 이길 수 있어
       보조 수단이며, 실질 보강은 service-worker.js의 navigation no-store fetch가 담당한다. JS/CSS ?v= 유지. -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#0d1117"/>
  <meta name="color-scheme" content="light"/> <!-- CROSS-A: 삼성인터넷 등 강제 다크모드 색반전 방지 -->
  <!-- v36: PWA — 홈 화면에 추가하면 전체화면 앱처럼 동작 -->
  <link rel="manifest" href="manifest.json"/>
  <!-- MODE-REGRESS-GUARD(2026-07-16): 설치 전용 SW 자체 등록 — index.html을 안 거치고 viewer.html에
       직접 진입해도 SW가 등록돼 navigation no-store로 stale 진입 HTML(옛 번들 로드)을 막는다.
       설치 전용·캐시0·network-only라 부작용 없음. index.html:212 동일. -->
  <script>
    if ('serviceWorker' in navigator && window.isSecureContext) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./service-worker.js', { scope: './', updateViaCache: 'none' })
          .catch(function () { /* 등록 실패는 조용히 무시 */ });
      });
    }
  </script>
  <link rel="icon" type="image/png" href="icons/icon-192.png"/>
  <link rel="apple-touch-icon" href="icons/icon-192.png"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="가지"/>
  <title>가지 branch — 작품 보기</title>
  <!-- IMG-PREFETCH-Q1(2026-07-06): 그림 서버(Storage) TLS 사전 연결 — 첫 그림 요청에서
       DNS+TLS 악수(~0.1-0.3s)를 미리 끝내둔다. 장면 그림은 두 호스트를 모두 사용:
       원본=storage.googleapis.com / AI 발행(s2)=firebasestorage.googleapis.com. -->
  <link rel="preconnect" href="https://storage.googleapis.com" crossorigin/>
  <link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin/>
  <!-- FONT-NONBLOCK(#45): 방화벽/느린 회선(크롬북)에서 폰트 CDN 연결을 미리 여는 preconnect + 갈무리(장식 픽셀폰트) 비차단 로드. -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700&family=Gowun+Batang:wght@400;700&family=Black+Han+Sans&family=Nanum+Pen+Script&family=Gaegu:wght@400;700&family=Cormorant+Garamond:wght@400;700&family=Hahmlet:wght@400;700&family=Diphylleia&family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@400;700&family=Gowun+Dodum&family=Do+Hyeon&family=Hi+Melody&family=Yeon+Sung&family=East+Sea+Dokdo&family=Stylish&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/gh/quiple/galmuri/dist/galmuri.css" rel="stylesheet" media="print" onload="this.media='all'"/>
  <noscript><link href="https://cdn.jsdelivr.net/gh/quiple/galmuri/dist/galmuri.css" rel="stylesheet"/></noscript>

  <!-- W8: 자동 진입(?team= 있을 때) 깜빡임 차단.
       maker → "감상 테스트" / "다듬기" 진입 시 entry 화면이 잠깐 보였다가 사라지는 현상 제거.
       JS 로드 전에 inline으로 처리 — CSS의 #entry-screen{display:flex} 효과 무력화. -->
  <script>
    (function () {
      try {
        var p = new URLSearchParams(location.search);
        if (p.get('team')) {
          var s = document.createElement('style');
          s.textContent = ''
            + '#entry-screen{display:none !important;}'
            + '#auto-enter-loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;'
            + 'background:#fbf6ea;font-family:\'Jua\',sans-serif;color:#6b5638;font-size:14px;letter-spacing:0.02em;z-index:200;}'
            + '#auto-enter-loading.fade-out{opacity:0;transition:opacity 0.25s ease-out;pointer-events:none;}';
          document.head.appendChild(s);
          /* 로딩 표시 — body 첫 자식으로 박기 (DOMContentLoaded 후 추가) */
          document.addEventListener('DOMContentLoaded', function () {
            if (document.getElementById('auto-enter-loading')) return;
            var el = document.createElement('div');
            el.id = 'auto-enter-loading';
            el.textContent = '작품을 불러오는 중…';
            document.body.appendChild(el);
          });
          /* viewer-entry.js가 _enterViewer 완료 후 player 렌더 끝나면 이 함수가 로딩 제거 */
          window.__hideAutoEnterLoading = function () {
            var el = document.getElementById('auto-enter-loading');
            if (!el) return;
            el.classList.add('fade-out');
            setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 280);
          };
        }
      } catch (e) { /* noop */ }
    })();
  </script>
</head>

<!-- PERF-2: viewer 편집(viewer-edit.js)·AI(viewer-ai.js) 코드 지연 로딩.
     감상 모드는 둘 다 로드하지 않음(초기 다운로드 ~568KB 감소). 편집 진입 시 window.ensureEditBundle()로 1회 로드.
     · 감상 렌더는 편집 함수를 editMode+typeof 가드로만 호출 → 미로드여도 안전.
     · 중복 로드 방지(Promise 1개), 실패 시 promise reset(재시도 가능). -->
<script>
(function () {
  var EDIT_SRC = 'viewer-edit.js?v=fe74449c2f';
  var AI_SRC   = 'viewer-ai.js?v=26cf15587f';
  /* WRITE-AFTER-VIEWER-HTML-CACHE-HARDENED: 디버그 마커 — 로드된 진입 HTML이 어떤 번들 cachebuster를
     들고 있는지 콘솔로 확인(옛 viewer.html 캐시 의심 시 한눈에 비교). 동작 영향 없음. */
  try { console.log('[viewer] bundle cachebuster: AI_SRC=' + AI_SRC.split('?v=')[1] + ' / EDIT_SRC=' + EDIT_SRC.split('?v=')[1]); } catch (e) {}
  /* PERF-2B-1: 편집 전용 viewer-image-edit.js(그림 편집툴)·storyAnalyzer.js(루트/구조 보기)도 지연 로드.
     감상 모드는 미로드(추가 ~70KB 감소). 편집 진입 시 edit 번들에 포함. */
  var IMG_SRC   = 'viewer-image-edit.js?v=b0fde65066';
  var STORY_SRC = 'storyAnalyzer.js?v=4799502ff8';
  var loaders = {};
  function loadOnce(src, key) {
    if (loaders[key]) return loaders[key];
    loaders[key] = new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = src; s.async = false; /* 번들 내 실행 순서 보존 */
      s.onload = function () { resolve(); };
      s.onerror = function () { loaders[key] = null; reject(new Error('script load failed: ' + src)); };
      document.head.appendChild(s);
    });
    return loaders[key];
  }
  /* 편집 번들 = viewer-edit.js → viewer-image-edit.js → storyAnalyzer.js → viewer-ai.js 순차 로드(Codex 권장 순서).
     편집 전역(initEditInteractions·enterImageTransformEdit·_rt*·viewerAi)이 startViewerEdit/팝오버 전에 모두 준비됨. 항상 같은 Promise. */
  window.ensureEditBundle = function () {
    return loadOnce(EDIT_SRC, 'edit')
      .then(function () { return loadOnce(IMG_SRC, 'img'); })
      .then(function () { return loadOnce(STORY_SRC, 'story'); })
      .then(function () { return loadOnce(AI_SRC, 'ai'); });
  };
  /* FIELD-FIX-B: 감상 세션용 — viewer-ai.js 1개만 지연 로드(편집 번들 3개는 미로드 유지).
     PERF-2가 viewer-ai를 편집 번들에만 묶으며 '감상자 공통 글 보기 토글'(Phase 4-A)이 사라진
     회귀 복구. 호출은 loadTeamData가 s2 변형 있는 작품에서만(없으면 기존과 동일 0 로드).
     같은 key 'ai'라 편집 번들과 중복 로드 0. */
  window.ensureAiViewBundle = function () { return loadOnce(AI_SRC, 'ai'); };
})();
</script>
