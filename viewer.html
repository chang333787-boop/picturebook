<!DOCTYPE html>

<head>
  <meta charset="UTF-8"/>
  <!-- WRITE-AFTER-VIEWER-HTML-CACHE-HARDENED: 진입 HTML이 오래 캐시돼 옛 JS cachebuster(AI_SRC 등)로
       옛 번들을 로드하던 문제 방지. http-equiv meta는 GitHub Pages HTTP 헤더를 완전히 못 이길 수 있어
       보조 수단이며, 실질 보강은 service-worker.js의 navigation no-store fetch가 담당한다. JS/CSS ?v= 유지. -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>

       원본=storage.googleapis.com / AI 발행(s2)=firebasestorage.googleapis.com. -->

  <!-- W8: 자동 진입(?team= 있을 때) 깜빡임 차단.
       maker → "감상 테스트" / "다듬기" 진입 시 entry 화면이 잠깐 보였다가 사라지는 현상 제거.
       JS 로드 전에 inline으로 처리 — CSS의 #entry-screen{display:flex} 효과 무력화. -->
  <script>
    (function () {
      try {
        var p = new URLSearchParams(location.search);
        if (p.get('team')) {
          var s = document.createElement('style');
          s.textContent = ''
            + '#entry-screen{display:none !important;}'
            + '#auto-enter-loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;'
            + 'background:#fbf6ea;font-family:\'Jua\',sans-serif;color:#6b5638;font-size:14px;letter-spacing:0.02em;z-index:200;}'
            + '#auto-enter-loading.fade-out{opacity:0;transition:opacity 0.25s ease-out;pointer-events:none;}';
          document.head.appendChild(s);
          /* 로딩 표시 — body 첫 자식으로 박기 (DOMContentLoaded 후 추가) */
          document.addEventListener('DOMContentLoaded', function () {
            if (document.getElementById('auto-enter-loading')) return;
            var el = document.createElement('div');
            el.id = 'auto-enter-loading';
            el.textContent = '작품을 불러오는 중…';
            document.body.appendChild(el);
          });
          /* viewer-entry.js가 _enterViewer 완료 후 player 렌더 끝나면 이 함수가 로딩 제거 */
          window.__hideAutoEnterLoading = function () {
            var el = document.getElementById('auto-enter-loading');
            if (!el) return;
            el.classList.add('fade-out');
            setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 280);
          };
        }
      } catch (e) { /* noop */ }
    })();
  </script>

  /* PERF-2B-1: 편집 전용 viewer-image-edit.js(그림 편집툴)·storyAnalyzer.js(루트/구조 보기)도 지연 로드.
     감상 모드는 미로드(추가 ~70KB 감소). 편집 진입 시 edit 번들에 포함. */
  var IMG_SRC   = 'viewer-image-edit.js?v=96copyfix1';
  var STORY_SRC = 'storyAnalyzer.js?v=136heuristic3perf2b1';
  var loaders = {};
  function loadOnce(src, key) {
    if (loaders[key]) return loaders[key];
    loaders[key] = new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = src; s.async = false; /* 번들 내 실행 순서 보존 */
      s.onload = function () { resolve(); };
      s.onerror = function () { loaders[key] = null; reject(new Error('script load failed: ' + src)); };
      document.head.appendChild(s);
    });
    return loaders[key];
  }
  /* 편집 번들 = viewer-edit.js → viewer-image-edit.js → storyAnalyzer.js → viewer-ai.js 순차 로드(Codex 권장 순서).

  window.ensureEditBundle = function () {
    return loadOnce(EDIT_SRC, 'edit')
      .then(function () { return loadOnce(IMG_SRC, 'img'); })
      .then(function () { return loadOnce(STORY_SRC, 'story'); })
      .then(function () { return loadOnce(AI_SRC, 'ai'); });
